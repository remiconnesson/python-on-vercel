[project]
name = "langgraph-on-vercel"
version = "0.1.0"
description = "Minimal LangGraph agent served by FastAPI on Vercel, using Vercel AI Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "vercel>=0.11.4",
]

[dependency-groups]
dev = ["uvicorn>=0.54.0"]
