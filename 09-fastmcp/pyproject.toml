[project]
name = "fastmcp-on-vercel"
version = "0.1.0"
description = "A FastMCP server on Vercel: tools, a resource, a prompt and streamed progress, served over Streamable HTTP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "fastmcp>=4.0.11",
]

[dependency-groups]
# Local web server only; Vercel runs the ASGI app itself.
dev = ["uvicorn>=0.54.0"]
